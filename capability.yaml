# Capability manifest for the organization's admission check.
# jcheng-devices is an L3 repository: the ecosystem device library. It holds
# declarative device profiles, device capability profiles and an offline
# validator (JCHENG-Robotics/.github docs/repo-taxonomy.md, layer L3).
#
# v0.1.0 is offline-only. It has no runtime node, publishes no topic, opens no
# device and joins no runtime graph. Device I/O remains with jcheng-system's
# hardware bridge; this repository describes devices, it never drives them.
# The empty runtime surface is deliberate: a planned capability must not claim
# a topic it does not serve. An adapter contract (v0.3.x) and a controlled
# integration (v0.4.x) require a reviewed contract first.
schema_version: 1
name: jcheng-devices
version: 0.1.0
contract:
  interfaces: ">=0.2,<0.3"
  contract_hash: "sha256:afca22a42f7163e0351d185d5a8577b0b51f2f3da4b92278f161a4a7d2c35b1c"
  system_api: ">=0.2,<0.4"
safety:
  class: offline
  scopes: []
  # Required by capability-manifest.v1.schema.json. Vacuous in v0.1.0: the
  # repository produces no intent and exposes no execution surface.
  requires_lease: true
  max_rate_hz: 1
  deadman_ms: 500
hardware_access: none
runtime:
  ros_domains: []
  publishes: []
  subscribes: []
