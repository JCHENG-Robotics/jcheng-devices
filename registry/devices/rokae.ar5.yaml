notes: >
  Family-level reference only. The owner's physical arms are the AR5L (left)
  and AR5R (right) variants, registered separately as `rokae.ar5l` and
  `rokae.ar5r`; this family entry is not a substitute for either unit and must
  not be used to plan or deploy. `arm.position_control` is a generic planned
  capability, not a vendor-confirmed ecosystem interface. DOF is an attribute,
  not the device name. Instance IDs are assigned separately when a real unit
  exists. Do not plan, limit-check or deploy from this profile until local
  controller data is verified.
